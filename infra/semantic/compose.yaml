services:
  semantic:
    build: .
    image: yarenler-semantic:6
    container_name: yarenler-semantic
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    env_file: /data/yarenler/secrets/semantic.env
    volumes:
      - /data/yarenler/models:/models
    networks: [coolify]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 60s
      start_period: 30m
networks:
  coolify:
    external: true
