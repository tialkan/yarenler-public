[project]
name = "yarenler-pipeline"
version = "0.0.1"
description = "Yarenler veri hattı: keşif, çekme, ayrıştırma, normalleştirme, kimlik çözümleme, zenginleştirme, gömme, sıcaklık, yerleşim"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
dependencies = [
    "httpx>=0.28",
    "selectolax>=1.0",
    "pydantic>=2.12",
    "protego>=0.7",
]

[project.scripts]
yarenler = "yarenler_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yarenler_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
